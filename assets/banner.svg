<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Movade: a rotating 3D wireframe globe with a plane orbiting it and pulsing destination pins">
  <defs>
    <radialGradient id="bg" cx="70%" cy="50%" r="75%">
      <stop offset="0" stop-color="#16200f"/>
      <stop offset="0.55" stop-color="#0d120e"/>
      <stop offset="1" stop-color="#0b0f0d"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#b6ff3c" stop-opacity="0.32"/>
      <stop offset="0.6" stop-color="#b6ff3c" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#b6ff3c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sphere" cx="38%" cy="32%" r="75%">
      <stop offset="0" stop-color="#25331a"/>
      <stop offset="0.6" stop-color="#121a10"/>
      <stop offset="1" stop-color="#070a08"/>
    </radialGradient>
    <clipPath id="globeClip"><circle cx="850" cy="205" r="120"/></clipPath>
    <path id="orbit" d="M1030 205 A180 52 0 1 1 670 205 A180 52 0 1 1 1030 205"/>
  </defs>

  <style>
    /* Meridians: each ellipse narrows to a line and widens again, out of phase, so the globe turns. */
    .mer { fill: none; stroke: #b6ff3c; stroke-opacity: .5; stroke-width: 1; transform-box: view-box; transform-origin: 850px 205px; animation: turn 9s linear infinite; }
    .m2 { animation-delay: -1.5s } .m3 { animation-delay: -3s } .m4 { animation-delay: -4.5s } .m5 { animation-delay: -6s } .m6 { animation-delay: -7.5s }
    @keyframes turn {
      0%   { transform: scaleX(1);   stroke-opacity: .55 }
      25%  { transform: scaleX(0);   stroke-opacity: .15 }
      50%  { transform: scaleX(-1);  stroke-opacity: .55 }
      75%  { transform: scaleX(0);   stroke-opacity: .15 }
      100% { transform: scaleX(1);   stroke-opacity: .55 }
    }
    .lat { fill: none; stroke: #b6ff3c; stroke-opacity: .22; }
    .halo { transform-box: fill-box; transform-origin: center; animation: breathe 5s ease-in-out infinite; }
    @keyframes breathe { 0%,100% { transform: scale(1); opacity: .85 } 50% { transform: scale(1.08); opacity: 1 } }
    .float { animation: bob 6s ease-in-out infinite; }
    @keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-8px) } }
    .star { fill: #ffffff; animation: twinkle 3s ease-in-out infinite; }
    .s2 { animation-delay: -1s } .s3 { animation-delay: -2s }
    @keyframes twinkle { 0%,100% { opacity: .15 } 50% { opacity: .7 } }
    .rise { animation: rise 1.4s cubic-bezier(.16,1,.3,1) both; }
    .r2 { animation-delay: .2s } .r3 { animation-delay: .4s } .r4 { animation-delay: .6s }
    @keyframes rise { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }
    .bar { fill: #b6ff3c; transform-box: fill-box; transform-origin: left center; animation: fill 8s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes fill { 0% { transform: scaleX(0) } 90%,100% { transform: scaleX(1) } }
    .fr { opacity: 0; animation: 8s steps(1,end) infinite; }
    .f1 { animation-name: f1 } .f2 { animation-name: f2 } .f3 { animation-name: f3 } .f4 { animation-name: f4 }
    @keyframes f1 { 0%,24.99% { opacity: 1 } 25%,100% { opacity: 0 } }
    @keyframes f2 { 0%,24.99% { opacity: 0 } 25%,49.99% { opacity: 1 } 50%,100% { opacity: 0 } }
    @keyframes f3 { 0%,49.99% { opacity: 0 } 50%,74.99% { opacity: 1 } 75%,100% { opacity: 0 } }
    @keyframes f4 { 0%,74.99% { opacity: 0 } 75%,100% { opacity: 1 } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important } .fr.f1, .rise { opacity: 1 } }
  </style>

  <rect width="1200" height="400" fill="url(#bg)"/>
  <circle class="halo" cx="850" cy="205" r="230" fill="url(#glow)"/>

  <!-- stars -->
  <g>
    <circle class="star" cx="610" cy="60" r="1.2"/><circle class="star s2" cx="1100" cy="70" r="1.4"/>
    <circle class="star s3" cx="1140" cy="320" r="1.1"/><circle class="star" cx="640" cy="350" r="1"/>
    <circle class="star s2" cx="1010" cy="40" r="1"/><circle class="star s3" cx="700" cy="110" r="1.3"/>
  </g>

  <g class="float">
    <!-- back half of the orbit (behind the globe) -->
    <path d="M1030 205 A180 52 0 0 0 670 205" fill="none" stroke="#b6ff3c" stroke-opacity=".22" stroke-dasharray="3 6" transform="rotate(-14 850 205)"/>

    <!-- globe -->
    <circle cx="850" cy="205" r="120" fill="url(#sphere)"/>
    <g clip-path="url(#globeClip)">
      <ellipse class="lat" cx="850" cy="205" rx="120" ry="22"/>
      <ellipse class="lat" cx="850" cy="160" rx="111" ry="19"/>
      <ellipse class="lat" cx="850" cy="250" rx="111" ry="19"/>
      <ellipse class="lat" cx="850" cy="118" rx="84" ry="14"/>
      <ellipse class="lat" cx="850" cy="292" rx="84" ry="14"/>
      <ellipse class="mer"    cx="850" cy="205" rx="120" ry="120"/>
      <ellipse class="mer m2" cx="850" cy="205" rx="120" ry="120"/>
      <ellipse class="mer m3" cx="850" cy="205" rx="120" ry="120"/>
      <ellipse class="mer m4" cx="850" cy="205" rx="120" ry="120"/>
      <ellipse class="mer m5" cx="850" cy="205" rx="120" ry="120"/>
      <ellipse class="mer m6" cx="850" cy="205" rx="120" ry="120"/>
    </g>
    <circle cx="850" cy="205" r="120" fill="none" stroke="#b6ff3c" stroke-opacity=".6" stroke-width="1.4"/>

    <!-- pulsing destination pins with a flight arc between two of them -->
    <path d="M800 168 Q 860 110 905 150" fill="none" stroke="#b6ff3c" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="120" stroke-dashoffset="120">
      <animate attributeName="stroke-dashoffset" values="120;0;0;120" keyTimes="0;0.4;0.8;1" dur="4s" repeatCount="indefinite"/>
    </path>
    <g fill="#b6ff3c">
      <g><circle cx="800" cy="168" r="3.4"/><circle cx="800" cy="168" r="3" fill-opacity=".5"><animate attributeName="r" values="3;13" dur="2s" repeatCount="indefinite"/><animate attributeName="fill-opacity" values=".6;0" dur="2s" repeatCount="indefinite"/></circle></g>
      <g><circle cx="905" cy="150" r="3.4"/><circle cx="905" cy="150" r="3" fill-opacity=".5"><animate attributeName="r" values="3;13" dur="2s" begin=".5s" repeatCount="indefinite"/><animate attributeName="fill-opacity" values=".6;0" dur="2s" begin=".5s" repeatCount="indefinite"/></circle></g>
      <g><circle cx="880" cy="245" r="3"/><circle cx="880" cy="245" r="3" fill-opacity=".5"><animate attributeName="r" values="3;11" dur="2s" begin="1s" repeatCount="indefinite"/><animate attributeName="fill-opacity" values=".6;0" dur="2s" begin="1s" repeatCount="indefinite"/></circle></g>
      <g><circle cx="782" cy="232" r="2.6"/><circle cx="782" cy="232" r="3" fill-opacity=".5"><animate attributeName="r" values="3;10" dur="2s" begin="1.5s" repeatCount="indefinite"/><animate attributeName="fill-opacity" values=".6;0" dur="2s" begin="1.5s" repeatCount="indefinite"/></circle></g>
    </g>
    <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#ffffff">
      <rect x="738" y="176" width="52" height="18" rx="9" fill="#000" fill-opacity=".8"/><text x="764" y="189" text-anchor="middle">Dhaka</text>
      <rect x="914" y="128" width="50" height="18" rx="9" fill="#000" fill-opacity=".8"/><text x="939" y="141" text-anchor="middle">Tokyo</text>
    </g>

    <!-- front half of the orbit and the plane riding it (dims while it passes behind the globe) -->
    <path d="M1030 205 A180 52 0 0 1 670 205" fill="none" stroke="#b6ff3c" stroke-opacity=".55" stroke-dasharray="3 6" transform="rotate(-14 850 205)"/>
    <g transform="rotate(-14 850 205)">
      <g>
        <path d="M-9 -3 L6 0 L-9 3 L-6 0 Z M-2 -1 L-6 -8 L-3 -8 L3 -1 Z M-2 1 L-6 8 L-3 8 L3 1 Z" fill="#ffffff"/>
        <animateMotion dur="7s" repeatCount="indefinite" rotate="auto"><mpath href="#orbit"/></animateMotion>
        <animate attributeName="opacity" values="1;1;.12;.12;1" keyTimes="0;.47;.53;.97;1" dur="7s" repeatCount="indefinite"/>
      </g>
    </g>
  </g>

  <!-- left: badge, wordmark, tagline -->
  <g class="rise">
    <rect x="64" y="72" width="196" height="30" rx="15" fill="#ffffff" fill-opacity=".92"/>
    <text x="84" y="92" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#b6ff3c">✦</text>
    <text x="102" y="92" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0b0f0d">Travel More, Worry Less</text>
  </g>
  <g class="rise r2" font-family="Syne, 'Arial Black', 'Segoe UI', Helvetica, sans-serif" fill="#ffffff">
    <path d="M64 136 L100 152 L64 168 L71 152 Z" fill="#b6ff3c"/>
    <text x="114" y="166" font-size="46" font-weight="800" letter-spacing="1">Movade</text>
  </g>
  <text class="rise r3" x="64" y="210" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#ffffff">Explore the World, One Journey at a Time.</text>
  <text class="rise r3" x="64" y="238" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#9ca3af">Pinned scroll hero · 197 frames · Lenis + GSAP + Framer Motion</text>

  <!-- scroll → frame counter -->
  <g class="rise r4" font-family="Consolas, Menlo, 'Courier New', monospace">
    <text x="64" y="300" font-size="10" letter-spacing="3" fill="#b6ff3c">SCROLL → FRAME</text>
    <text class="fr f1" x="64" y="324" font-size="13" fill="#e5e7eb">001 / 197 · above the clouds</text>
    <text class="fr f2" x="64" y="324" font-size="13" fill="#e5e7eb">066 / 197 · into the canopy</text>
    <text class="fr f3" x="64" y="324" font-size="13" fill="#e5e7eb">132 / 197 · the waterfall</text>
    <text class="fr f4" x="64" y="324" font-size="13" fill="#e5e7eb">197 / 197 · on the trail</text>
    <rect x="64" y="338" width="260" height="3" rx="1.5" fill="#ffffff" fill-opacity=".12"/>
    <rect class="bar" x="64" y="338" width="260" height="3" rx="1.5"/>
  </g>
</svg>
